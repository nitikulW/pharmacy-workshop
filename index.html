<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบร้านยาจำลอง · หน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --card: #181818;
    --card-hover: #222222;
    --sub: #1f1f1f;
    --line: #2a2a2a;
    --border: #383838;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #1ed760;
    --radius: 14px;
    --pill: 9999px;
    --shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 48px;
  }

  header.hero {
    margin-bottom: 24px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px;
    border-radius: var(--pill);
    background: rgba(30, 215, 96, 0.12);
    border: 1px solid rgba(30, 215, 96, 0.45);
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.35;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .notice {
    margin: 18px 0 24px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    color: var(--muted);
    font-size: 16px;
  }

  .notice strong {
    color: var(--text);
    font-weight: 600;
  }

  nav.menu-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 84px;
    padding: 18px 20px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: background-color 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
  }

  a.nav-btn:hover {
    background: var(--card-hover);
    border-color: var(--accent);
  }

  a.nav-btn:active {
    transform: scale(0.99);
  }

  a.nav-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
    border-color: var(--accent);
    background: var(--card-hover);
  }

  .nav-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .nav-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
  }

  .nav-desc {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.5;
  }

  .nav-arrow {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: var(--pill);
    background: rgba(30, 215, 96, 0.14);
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
    transition: background-color 0.14s ease, color 0.14s ease;
  }

  a.nav-btn:hover .nav-arrow,
  a.nav-btn:focus-visible .nav-arrow {
    background: var(--accent);
    color: #000000;
  }

  footer.foot {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 16px;
  }

  @media (min-width: 640px) {
    .wrap { padding: 40px 24px 56px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">เวิร์กชอปร้านยาจำลอง</p>
      <h1>ระบบจัดการร้านยาจำลอง</h1>
      <p class="subtitle">เลือกหน้าที่ต้องการใช้งานจากรายการด้านล่าง</p>
    </header>

    <p class="notice" role="note">
      <strong>คำเตือน:</strong> ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง
    </p>

    <nav id="menu" class="menu-list" aria-label="เมนูหลักของระบบร้านยา"></nav>

    <footer class="foot">
      ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง
    </footer>
  </main>

<script>
'use strict';

/* รายการปุ่มลิงก์หลักของระบบ — เพิ่มหรือลบหน้าได้ด้วยการแก้หนึ่งบรรทัด */
const LINKS = [
  { href: 'pos.html', title: 'หน้าขายยา', desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
  { href: 'admin.html', title: 'จัดการระบบ (ผู้ดูแล)', desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
  { href: 'dashboard.html', title: 'Dashboard คลังยา', desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
  { href: 'status.html', title: 'ตรวจสถานะระบบ', desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
];

/* สร้างปุ่มลิงก์จากอาร์เรย์ LINKS ด้วย createElement และ textContent */
function renderMenu() {
  const menu = document.getElementById('menu');
  const fragment = document.createDocumentFragment();

  for (const item of LINKS) {
    const link = document.createElement('a');
    link.className = 'nav-btn';
    link.href = item.href;

    const textBox = document.createElement('span');
    textBox.className = 'nav-text';

    const title = document.createElement('span');
    title.className = 'nav-title';
    title.textContent = item.title;

    const desc = document.createElement('span');
    desc.className = 'nav-desc';
    desc.textContent = item.desc;

    const arrow = document.createElement('span');
    arrow.className = 'nav-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '→';

    textBox.append(title, desc);
    link.append(textBox, arrow);
    fragment.append(link);
  }

  menu.replaceChildren(fragment);
}

renderMenu();
</script>
</body>
</html>
