<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบร้านยาจำลอง · หน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app-shell.css">
<style>
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 4px 0 32px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5eead4;
  }

  .notice {
    margin: 0 0 20px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 14px;
    box-shadow: var(--shadow);
    color: var(--text-2);
    font-size: 15.5px;
  }

  .notice strong {
    color: var(--text);
    font-weight: 700;
  }

  nav.menu-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 84px;
    padding: 18px 22px;
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }

  a.nav-btn:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  a.nav-btn:active {
    transform: translateY(0);
  }

  a.nav-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-color: var(--primary);
  }

  .nav-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .nav-title {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
  }

  .nav-desc {
    font-size: 15.5px;
    color: var(--text-2);
    line-height: 1.5;
  }

  .nav-arrow {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-text);
    font-size: 20px;
    font-weight: 700;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  a.nav-btn:hover .nav-arrow,
  a.nav-btn:focus-visible .nav-arrow {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
  }

  footer.foot {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--text-2);
    font-size: 14.5px;
  }
</style>
</head>
<body data-shell-title="ระบบจัดการร้านยาจำลอง" data-shell-crumb="เวิร์กชอปร้านยาจำลอง">
  <main class="wrap" data-shell-content>
    <header class="hero rise">
      <p class="eyebrow">เวิร์กชอปร้านยาจำลอง</p>
      <h2>ระบบจัดการร้านยาจำลอง</h2>
      <p class="subtitle">เลือกหน้าที่ต้องการใช้งานจากรายการด้านล่าง</p>
    </header>

    <p class="notice rise" style="--d:60ms" role="note">
      <strong>คำเตือน:</strong> ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง
    </p>

    <nav id="menu" class="menu-list rise" style="--d:120ms" aria-label="เมนูหลักของระบบร้านยา"></nav>

    <footer class="foot">
      ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง
    </footer>
  </main>

<script src="assets/app-shell.js"></script>

<script>
'use strict';

/* รายการปุ่มลิงก์หลักของระบบ — เพิ่มหรือลบหน้าได้ด้วยการแก้หนึ่งบรรทัด */
const LINKS = [
  { href: 'pos.html', title: 'หน้าขายยา', desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
  { href: 'admin.html', title: 'จัดการระบบ (ผู้ดูแล)', desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
  { href: 'dashboard.html', title: 'Dashboard คลังยา', desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
  { href: 'status.html', title: 'ตรวจสถานะระบบ', desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
];

/* สร้างปุ่มลิงก์จากอาร์เรย์ LINKS ด้วย createElement และ textContent */
function renderMenu() {
  const menu = document.getElementById('menu');
  const fragment = document.createDocumentFragment();

  for (const item of LINKS) {
    const link = document.createElement('a');
    link.className = 'nav-btn';
    link.href = item.href;

    const textBox = document.createElement('span');
    textBox.className = 'nav-text';

    const title = document.createElement('span');
    title.className = 'nav-title';
    title.textContent = item.title;

    const desc = document.createElement('span');
    desc.className = 'nav-desc';
    desc.textContent = item.desc;

    const arrow = document.createElement('span');
    arrow.className = 'nav-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '→';

    textBox.append(title, desc);
    link.append(textBox, arrow);
    fragment.append(link);
  }

  menu.replaceChildren(fragment);
}

renderMenu();
</script>
</body>
</html>
